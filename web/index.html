<!DOCTYPE html>
<html lang="ko">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#FBF9F5">
  <meta name="description" content="꿈을 기록할 때마다 나만의 소설이 자라는 창작 앱.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="무무몽">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>무무몽</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <style>
    /* V2 startup: the same sky as the first app screen, so the handover to
       Flutter's first frame does not flash. The light drifts like the app's
       atmosphere; Reduce Motion keeps everything still. */
    @font-face {
      font-family: "MaruBuri"; font-display: swap;
      src: url("assets/assets/fonts/MaruBuri-Regular.ttf") format("truetype");
    }
    html, body { background: #FBF9F5; }
    body { margin: 0; }
    #pwa-startup {
      position: fixed; inset: 0; z-index: 2147483647; box-sizing: border-box;
      display: grid; place-content: center; justify-items: center;
      padding: 24px; overflow: hidden; isolation: isolate;
      background: linear-gradient(180deg, #8DBDE8 0%, #CCE1F4 30%, #F2F7FC 55%, #FBF9F5 80%);
      color: #15181D; text-align: center; line-height: 1.55;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif;
      word-break: keep-all;
    }
    #pwa-startup::before, #pwa-startup::after {
      content: ""; position: absolute; z-index: -1; border-radius: 50%;
      filter: blur(28px); pointer-events: none;
    }
    #pwa-startup::before {
      width: 110vmax; height: 80vmax; left: 10vw; top: -38vmax;
      background: radial-gradient(closest-side, rgba(173,206,238,.75), rgba(173,206,238,0));
      animation: mm-drift-a 14s ease-in-out infinite alternate;
    }
    #pwa-startup::after {
      width: 80vmax; height: 70vmax; left: -36vmax; top: -18vmax;
      background: radial-gradient(closest-side, rgba(248,236,200,.6), rgba(248,236,200,0));
      animation: mm-drift-b 14s ease-in-out infinite alternate;
    }
    @keyframes mm-drift-a { to { transform: translate(-12vw, 6vh); } }
    @keyframes mm-drift-b { to { transform: translate(14vw, 5vh); } }
    #pwa-startup[hidden], #pwa-retry[hidden] { display: none; }
    #pwa-startup .mm-wordmark {
      margin: 0 0 28px; font: 22px/1 "MaruBuri", serif; letter-spacing: .02em;
    }
    #pwa-startup .mm-wordmark span { color: #5E9DD8; letter-spacing: .1em; }
    #pwa-startup .mm-orb {
      position: relative; width: 64px; height: 64px; margin: 0 0 24px;
      animation: mm-turn 7s linear infinite;
    }
    #pwa-startup .mm-orb i {
      position: absolute; left: 29px; top: 2px; width: 6px; height: 6px;
      border-radius: 50%; background: #2A609A; transform-origin: 3px 30px;
    }
    @keyframes mm-turn { to { transform: rotate(360deg); } }
    #pwa-startup h1 {
      margin: 0 0 8px; font: 500 20px/1.4 "MaruBuri", serif; color: #15181D;
    }
    #pwa-startup p {
      max-width: 320px; margin: 0 auto 24px; font-size: 15px; color: #454A52;
    }
    #pwa-retry {
      min-height: 52px; width: min(280px, 100%); justify-self: center;
      border-radius: 26px; border: 0; color: #FFFEFB; background: #15181D;
      box-shadow: 0 10px 24px rgba(21,24,29,.18);
      font: inherit; font-weight: 600; cursor: pointer; touch-action: manipulation;
    }
    #pwa-retry:active { transform: scale(.968); }
    /* A failed start offers retry; the orb stops instead of implying work. */
    #pwa-startup:has(#pwa-retry:not([hidden])) .mm-orb { animation: none; opacity: .35; }
    @media (prefers-reduced-motion: reduce) {
      #pwa-startup::before, #pwa-startup::after, #pwa-startup .mm-orb { animation: none; }
    }
  </style>
  <section id="pwa-startup" aria-labelledby="pwa-startup-title">
    <div class="mm-wordmark" aria-hidden="true">무무몽 <span>···</span></div>
    <div class="mm-orb" aria-hidden="true">
      <i style="transform:rotate(0deg)"></i><i style="transform:rotate(30deg);opacity:.85"></i>
      <i style="transform:rotate(60deg);opacity:.7"></i><i style="transform:rotate(90deg);opacity:.58"></i>
      <i style="transform:rotate(120deg);opacity:.48"></i><i style="transform:rotate(150deg);opacity:.4"></i>
      <i style="transform:rotate(180deg);opacity:.34"></i><i style="transform:rotate(210deg);opacity:.28"></i>
      <i style="transform:rotate(240deg);opacity:.23"></i><i style="transform:rotate(270deg);opacity:.19"></i>
      <i style="transform:rotate(300deg);opacity:.16"></i><i style="transform:rotate(330deg);opacity:.13"></i>
    </div>
    <h1 id="pwa-startup-title">무무몽을 여는 중이에요</h1>
    <p id="pwa-startup-status" role="status" aria-live="polite">화면을 준비하고 있어요.</p>
    <button id="pwa-retry" type="button" hidden>다시 열기</button>
  </section>
  <noscript>무무몽을 사용하려면 브라우저의 JavaScript를 켜 주세요.</noscript>
  <script id="pwa-startup-guard">
    (() => {
      let ready = false;
      const shell = document.getElementById('pwa-startup');
      const title = document.getElementById('pwa-startup-title');
      const status = document.getElementById('pwa-startup-status');
      const retry = document.getElementById('pwa-retry');
      const fail = () => {
        if (ready) return;
        title.textContent = '무무몽을 열지 못했어요';
        status.textContent = '연결을 확인한 뒤 다시 열어 주세요. 이 동작은 저장된 기록을 지우지 않아요.';
        retry.hidden = false;
      };
      const resourceError = (event) => {
        if (event.target?.tagName === 'SCRIPT' || event.target === window) fail();
      };
      const timeout = window.setTimeout(fail, 20000);
      retry.addEventListener('click', () => window.location.reload());
      window.addEventListener('error', resourceError, true);
      window.addEventListener('unhandledrejection', fail);
      window.addEventListener('flutter-first-frame', () => {
        ready = true;
        window.clearTimeout(timeout);
        window.removeEventListener('error', resourceError, true);
        window.removeEventListener('unhandledrejection', fail);
        shell.remove();
      }, { once: true });
      // Fixed startup messages only: never expose exception payloads or content.
      window.mumumongStartup = { fail };
    })();
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
